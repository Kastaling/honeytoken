# Copy to docker-compose.yml and customize for your deployment:
#   cp docker-compose.example.yml docker-compose.yml
#
# Create a .env file for secrets (never commit it):
#   cp .env.example .env

services:
  honey:
    build: .
    container_name: honey
    ports:
      # Trap: localhost only — reverse proxy on the same host should use 127.0.0.1:4040
      - "127.0.0.1:4040:4040"
      # Admin: bind to localhost by default. Set ADMIN_BIND_IP to your Tailscale IP for MagicDNS access.
      - "${ADMIN_BIND_IP:-127.0.0.1}:4090:4090"
    environment:
      - ROOT_DOMAIN=${ROOT_DOMAIN:-example.com}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:?Set ADMIN_PASS in .env or the shell environment}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:?Set ADMIN_SECRET_KEY in .env or the shell environment}
      - CARTO_API_KEY=${CARTO_API_KEY:?Set CARTO_API_KEY in .env or the shell environment}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - DATA_DIR=/data
      - TRAP_PORT=4040
      - ADMIN_PORT=4090
      - TRAP_MAX_REQUEST_BODY_SIZE=65536
      - ADMIN_MAX_REQUEST_BODY_SIZE=1048576
      - MAX_REQUEST_HEADER_SIZE=65536
      - BACKGROUND_WORKERS=4
      - BACKGROUND_QUEUE_CAPACITY=128
      # Optional automatic pruning; 0 keeps hits indefinitely.
      - HIT_RETENTION_DAYS=${HIT_RETENTION_DAYS:-0}
      - TRAP_UPSTREAM=${TRAP_UPSTREAM:-honey:4040}
      - GEOIP2_DB=/data/GeoLite2-City.mmdb
      - MEDIA_DIR=/media
    volumes:
      - ./data:/data
      # Optional: mount MaxMind GeoLite2-City (download from https://dev.maxmind.com/geoip/geolite2-free-geolocation-data)
      # - ./GeoLite2-City.mmdb:/data/GeoLite2-City.mmdb:ro
      - ./media:/media
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4090/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
