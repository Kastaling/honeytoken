[project]
name = "honeytoken-logger"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["data", "media"]

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP", "B"]
ignore = [
  "E501",
  "S101",
  "S110",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105"]
