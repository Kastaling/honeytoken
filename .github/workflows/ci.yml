name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
      - run: bandit -r . -x ./.git,./data,./media,./tests -q
      - run: pip-audit -r requirements.lock --progress-spinner off
      - run: docker compose -f docker-compose.example.yml config --quiet
        env:
          ADMIN_PASS: test
          ADMIN_SECRET_KEY: test
          CARTO_API_KEY: test
